name: Build C++ Executable

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Find Solution File
      id: find_sln
      shell: powershell
      run: |
        $sln = (Get-ChildItem -Recurse -Include *.sln, *.slnx | Select-Object -First 1).FullName
        if (-not $sln) { Write-Error "Solution file not found"; exit 1 }
        echo "SLN_PATH=$sln" >> $env:GITHUB_ENV
        Write-Host "Found solution at: $sln"

    - name: Restore NuGet Packages
      run: nuget restore "$env:SLN_PATH"

    - name: Build Project
      run: |
        msbuild "$env:SLN_PATH" /p:Configuration=Release /p:Platform=x64

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: DuneVisualsLoader-Build
        path: |
          **/Release/*.exe
          **/x64/Release/*.exe